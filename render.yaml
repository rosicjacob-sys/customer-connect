# Render Blueprint: Customer Connect web service + its own Postgres database.
# Render dashboard → Blueprints → New Blueprint Instance → pick this repo.
# Render asks for every `sync: false` value on the first deploy.

services:
  - type: web
    name: customer-connect
    runtime: node
    plan: starter
    region: oregon
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: customer-connect-db
          property: connectionString
      # Generated once by Render and kept. Never change UNSUBSCRIBE_SECRET
      # after emails have gone out: it breaks their unsubscribe links.
      - key: JWT_SECRET
        generateValue: true
      - key: UNSUBSCRIBE_SECRET
        generateValue: true

      # Public address used in unsubscribe links. Blank = this service's
      # onrender.com address; set it when you add your own domain.
      - key: APP_URL
        sync: false

      # Email (Resend). Without a key, set EMAIL_DRY_RUN=true to try it out.
      - key: RESEND_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: info@pepscustomercare.com
      - key: DEFAULT_FROM_NAME
        value: Customer Support

      # First admin, created on the first start only.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      # Chat Support Pro: new customers (one per email), stores and opt-outs
      # come from its API. The key must equal Chat Support Pro's
      # CUSTOMER_CONNECT_API_KEY.
      - key: CHAT_SUPPORT_API_URL
        value: https://chat-support-pro.onrender.com
      - key: CHAT_SUPPORT_API_KEY
        sync: false
      - key: CHAT_SUPPORT_SYNC_MINUTES
        value: "15"

      # Checkout portal: the same value goes in the portal's CUSTOMER_CONNECT_SECRET.
      - key: CHECKOUT_PORTAL_SECRET
        generateValue: true

databases:
  - name: customer-connect-db
    plan: basic-256mb
    region: oregon
    databaseName: customer_connect
    user: customer_connect
    postgresMajorVersion: "16"
    diskSizeGB: 5
    # Reachable only from Render services in this account (no public access).
    # To run SQL from your computer, add your IP under the database's Networking.
    ipAllowList: []
